<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nebojím se – pro lékaře</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #F4F6FA; --card: #FFFFFF; --ink: #1F2633; --muted: #667085; --line: #E3E8F0;
      --primary: #2F6DB5; --sel-bg: #EAF1FB; --good: #2E9E62;
      --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, select { font: inherit; color: inherit; cursor: pointer; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    header img { width: 52px; height: 52px; border-radius: 14px; }
    header h1 { margin: 0; font-size: 26px; font-weight: 900; }
    header p { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
    .ui-lang { margin-left: auto; display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    .ui-lang button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 13px; color: var(--muted); }
    .ui-lang button.sel { background: var(--sel-bg); color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
    .intro { margin: 0 0 6px; color: var(--muted); line-height: 1.45; }
    h2 { font-size: 15px; font-weight: 800; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .opts { display: grid; gap: 8px; }
    .opts.exam { grid-template-columns: repeat(3, 1fr); }
    .opts.age { grid-template-columns: repeat(3, 1fr); }
    .opts.lang { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 520px) { .opts.exam, .opts.lang { grid-template-columns: 1fr 1fr; } }
    .opt { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 8px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .opt span { font-size: 26px; }
    .opt small { color: var(--muted); font-weight: 600; font-size: 12px; }
    .opt.sel { border-color: var(--primary); background: var(--sel-bg); color: var(--primary); }
    .privacy { margin-top: 18px; padding: 12px 14px; background: #E5F6EC; color: #1E6B43; border-radius: 12px; font-size: 14px; font-weight: 600; }
    .side { position: sticky; top: 16px; display: grid; gap: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { border: 0; border-radius: 12px; padding: 12px; font-weight: 800; background: var(--sel-bg); color: var(--primary); }
    .btn.primary { grid-column: span 2; background: var(--primary); color: #fff; padding: 14px; font-size: 16px; }
    .url { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

    /* the printable card (what the parent gets) */
    .card { background: #FFFFFF; border: 2px dashed #FFC15B; border-radius: 22px; padding: 22px; text-align: center; color: #2B2A33; }
    .card .hosp { font-size: 12px; font-weight: 800; color: #7C8A99; letter-spacing: .03em; }
    .card .title { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 4px; font-size: 24px; font-weight: 900; }
    .card .title img { width: 36px; height: 36px; border-radius: 9px; }
    .card .pill { display: inline-block; padding: 6px 12px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 15px; margin: 6px 0 10px; }
    .card .qr svg { width: 220px; height: 220px; display: block; margin: 0 auto; }
    .card .how { margin: 10px 0 4px; font-size: 15px; font-weight: 700; line-height: 1.4; }
    .card .meta { font-size: 12px; color: #7C8A99; }

    @media print {
      @page { margin: 15mm; }
      body { background: #fff; }
      .wrap > header, .grid > .panel, .actions, .url, .noprint { display: none !important; }
      .grid { display: block; }
      .side { position: static; }
      .card { width: 90mm; margin: 0 auto; border-color: #999; }
      .card .qr svg { width: 60mm; height: 60mm; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../icon.svg" alt="">
      <div><h1 data-t="title"></h1><p>FN Brno · Dětská nemocnice</p></div>
      <div class="ui-lang" id="ui-lang"></div>
    </header>

    <div class="grid">
      <section class="panel">
        <p class="intro" data-t="intro"></p>
        <h2 data-t="exam"></h2>
        <div class="opts exam" id="o-exam"></div>
        <h2 data-t="age"></h2>
        <div class="opts age" id="o-age"></div>
        <h2 data-t="lang"></h2>
        <div class="opts lang" id="o-lang"></div>
        <p class="privacy">🔒 <span data-t="privacy"></span></p>
      </section>

      <aside class="side">
        <div class="card" id="card"></div>
        <div class="url" id="url"></div>
        <div class="actions">
          <button class="btn primary" id="b-print" data-t="print"></button>
          <button class="btn" id="b-png" data-t="png"></button>
          <button class="btn" id="b-copy" data-t="copy"></button>
          <button class="btn" id="b-open" data-t="open" style="grid-column: span 2"></button>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="../content.js"></script>
  <script>
    'use strict';
    // Doctor-facing UI (Czech / English). The card itself is printed in the family's language.
    const T = {
      title: ['QR kód pro rodiče', 'QR code for parents'],
      intro: ['Vyberte vyšetření, věk dítěte a jazyk rodiny. Kartičku vytiskněte k pozvánce nebo pošlete rodičům odkaz.', 'Choose the exam, the child’s age and the family’s language. Print the card with the invitation or send the parents the link.'],
      exam: ['Vyšetření', 'Examination'],
      age: ['Věk dítěte', 'Child’s age'],
      lang: ['Jazyk rodiny', 'Family language'],
      privacy: ['Kód neobsahuje žádné údaje o pacientovi — jen typ vyšetření, věkovou skupinu a jazyk.', 'The code contains no patient data — only the exam type, age group and language.'],
      print: ['🖨️ Tisknout kartičku', '🖨️ Print card'],
      png: ['⬇️ Stáhnout PNG', '⬇️ Download PNG'],
      copy: ['🔗 Kopírovat odkaz', '🔗 Copy link'],
      copied: ['✓ Zkopírováno', '✓ Copied'],
      open: ['👀 Otevřít jako rodič', '👀 Open as a parent'],
    };
    // Printed for the parent, in the family's language [en, cs, sk, uk]
    const HOW = ['Scan with your phone camera and prepare your child together. No app, no registration, works offline.', 'Naskenujte fotoaparátem telefonu a připravte se s dítětem spolu. Bez instalace a registrace, funguje i offline.', 'Naskenujte fotoaparátom telefónu a pripravte sa s dieťaťom spolu. Bez inštalácie a registrácie, funguje aj offline.', 'Відскануйте камерою телефону й підготуйтеся разом із дитиною. Без встановлення та реєстрації, працює офлайн.'];
    const FOR = ['Age', 'Věk', 'Vek', 'Вік'];

    const ui = { l: 0 };
    const st = { exam: 'blood', age: 'm', lang: 'cs' };
    try { Object.assign(st, JSON.parse(localStorage.getItem('nebojimse.doctor')) || {}); ui.l = +(localStorage.getItem('nebojimse.doctor.ui') || 0); } catch {}

    const APP = new URL('../', location.href);
    const fam = arr => arr[LANGS.indexOf(st.lang)];
    const t = k => T[k][ui.l];
    const link = () => { const u = new URL(APP); u.search = new URLSearchParams(st).toString(); return u.toString(); };

    function makeQR() { const q = qrcode(0, 'M'); q.addData(link()); q.make(); return q; }

    function opt(group, value, html, sel) {
      return `<button class="opt ${sel ? 'sel' : ''}" data-g="${group}" data-v="${value}">${html}</button>`;
    }

    function render() {
      document.documentElement.lang = ui.l ? 'en' : 'cs';
      document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
      document.getElementById('ui-lang').innerHTML = ['CZ', 'EN'].map((x, i) => `<button class="${ui.l === i ? 'sel' : ''}" data-ui="${i}">${x}</button>`).join('');
      const uiLangIdx = ui.l ? 0 : 1; // EXAMS names: en = 0, cs = 1
      document.getElementById('o-exam').innerHTML = Object.entries(EXAMS).map(([id, e]) => opt('exam', id, `<span>${e.emoji}</span>${e.name[uiLangIdx]}`, st.exam === id)).join('');
      document.getElementById('o-age').innerHTML = AGES.map(a => opt('age', a.id, `<span>${a.emoji}</span>${a.label}<small>${UI.years[uiLangIdx]}</small>`, st.age === a.id)).join('');
      document.getElementById('o-lang').innerHTML = LANGS.map(l => opt('lang', l, `<span>${l.toUpperCase()}</span>${LANG_NAMES[l]}`, st.lang === l)).join('');

      const e = EXAMS[st.exam], ageLabel = AGES.find(a => a.id === st.age).label;
      const svg = makeQR().createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      document.getElementById('card').innerHTML = `
        <div class="hosp">FN BRNO · DĚTSKÁ NEMOCNICE</div>
        <div class="title"><img src="../icon.svg" alt="">${fam(UI.appName)}</div>
        <div class="pill" style="background:${e.color}">${e.emoji} ${fam(e.name)}</div>
        <div class="qr">${svg}</div>
        <p class="how">${fam(HOW)}</p>
        <div class="meta">${fam(FOR)}: ${ageLabel} ${fam(UI.years)} · ${LANG_NAMES[st.lang]}</div>`;
      document.getElementById('url').textContent = link();
      document.title = (ui.l ? 'I’m Not Scared – for doctors' : 'Nebojím se – pro lékaře');
      try { localStorage.setItem('nebojimse.doctor', JSON.stringify(st)); localStorage.setItem('nebojimse.doctor.ui', ui.l); } catch {}
    }

    document.addEventListener('click', ev => {
      const o = ev.target.closest('[data-g]');
      if (o) { st[o.dataset.g] = o.dataset.v; render(); return; }
      const u = ev.target.closest('[data-ui]');
      if (u) { ui.l = +u.dataset.ui; render(); }
    });
    document.getElementById('b-print').onclick = () => window.print();
    document.getElementById('b-open').onclick = () => window.open(link(), '_blank', 'noopener');
    document.getElementById('b-copy').onclick = async ev => {
      const b = ev.currentTarget;
      try { await navigator.clipboard.writeText(link()); } catch { prompt('', link()); return; }
      b.textContent = t('copied'); setTimeout(() => b.textContent = t('copy'), 1500);
    };
    document.getElementById('b-png').onclick = () => {
      const q = makeQR(), n = q.getModuleCount(), cell = 24, m = 4, size = (n + m * 2) * cell;
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + m) * cell, (r + m) * cell, cell, cell);
      const a = document.createElement('a');
      a.download = `nebojimse-qr-${st.exam}-${st.age}-${st.lang}.png`;
      a.href = c.toDataURL('image/png'); a.click();
    };
    render();
  </script>
</body>
</html>
